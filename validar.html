<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Validar…</title>
  <script>
  (function () {
    var p = new URLSearchParams(location.search);
    var t = (p.get('token') || '').trim();
    if (!t) {
      document.write('<p>Falta token. Escanee el QR de la hoja.</p>');
      return;
    }
    location.replace('t/' + encodeURIComponent(t) + '.html');
  })();
  </script>
</head>
<body><p>Redirigiendo…</p></body>
</html>
