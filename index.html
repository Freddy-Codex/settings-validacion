<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Validación Settings</title>
  <style>
:root { --ok:#0b7a3b; --bad:#a11919; --warn:#8a5a00; --bg:#f4f6f8; --card:#fff; }
body { margin:0; font-family: Segoe UI, Arial, sans-serif; background:var(--bg); color:#1a1a1a; }
.wrap { max-width:560px; margin:24px auto; padding:0 16px; }
.card { background:var(--card); border-radius:12px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
.badge { display:inline-block; padding:10px 14px; border-radius:8px; color:#fff; font-weight:700; margin-bottom:14px; }
.ok { background:var(--ok); }
.bad { background:var(--bad); }
.warn { background:var(--warn); }
h1 { font-size:1.15rem; margin:0 0 8px; }
dl { margin:0; }
dt { font-size:.75rem; text-transform:uppercase; color:#666; margin-top:10px; }
dd { margin:2px 0 0; font-size:1rem; }
.hint { margin-top:16px; font-size:.9rem; color:#333; }
.foot { margin-top:18px; font-size:.75rem; color:#777; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Validación documental de settings</h1>
      <p>Escanee el QR de la hoja de terreno. Cada QR apunta a una página pública HTTPS.</p>
      <p class="hint">Sitio: https://Freddy-Codex.github.io/settings-validacion<br/>Tokens publicados: 1</p>
      <p class="foot">No requiere servidor local ni misma WiFi.</p>
    </div>
  </div>
</body>
</html>
